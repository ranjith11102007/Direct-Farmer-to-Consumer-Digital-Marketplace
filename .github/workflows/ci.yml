name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaikkal
          POSTGRES_PASSWORD: vaikkal_test_password
          POSTGRES_DB: vaikkal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaikkal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://vaikkal:vaikkal_test_password@localhost:5432/vaikkal_test
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Create database schema
        run: python -c "import asyncio; from app.database import init_db; asyncio.run(init_db())"

      - name: Debug failing requests
        run: |
          python - <<'PYEOF'
          import json
          import fastapi, starlette
          from fastapi.testclient import TestClient
          from app.main import app
          spec = app.openapi()
          for p in ["/api/v1/auth/register", "/api/v1/auth/login", "/api/v1/products/search", "/api/v1/products/categories"]:
              item = spec.get("paths", {}).get(p, {"MISSING": True})
              print("OPENAPI", p, "=>", json.dumps({k: item.get(k) for k in ("get", "post")}))
          print("VERSIONS", "fastapi", fastapi.__version__, "starlette", starlette.__version__)
          c = TestClient(app)
          r = c.post("/api/v1/auth/register", json={"phone": "9710000001", "password": "Strong@Pass123", "full_name": "Debug", "role": "consumer"}, params={"request": "x"})
          print("REGISTER_WITH_QUERY", r.status_code, r.text[:400])
          c2 = TestClient(app)
          r2 = c2.get("/api/v1/products/search", params={"q": "tomato"})
          print("SEARCH", r2.status_code, r2.text[:400])
          PYEOF

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build